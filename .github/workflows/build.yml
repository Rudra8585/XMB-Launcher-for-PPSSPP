name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish a Release for version tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      # The release key is stored as repository secrets. Pull requests from forks don't get secrets,
      # so their builds fall back to the debug key.
      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          XMB_KEYSTORE: ${{ runner.temp }}/release.jks
          XMB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XMB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XMB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          XMB_VERSION_CODE: ${{ github.run_number }}
          XMB_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "XMB-Launcher-$XMB_VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: xmb-launcher-apk
          path: XMB-Launcher-*.apk

      # Pushing a tag such as v1.0.0 publishes the APK as a GitHub Release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: XMB-Launcher-*.apk
          generate_release_notes: true
